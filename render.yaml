services:
  - type: web
    name: kidcurate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://testeenspace.site","http://localhost:3000"]'
      - key: DATABASE_URL
        fromDatabase:
          name: kidcurate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: "179684236627-d7j0s15cvkj6li430jku6easqma5q81l.apps.googleusercontent.com"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "kidcurateservices@gmail.com"

databases:
  - name: kidcurate-db
    plan: free
    databaseName: kidcurate
    user: kidcurate
    ipAllowList: []
