services:
  - type: web
    name: kidcurate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://testeenspace.site","http://localhost:3000"]'
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///kidcurate.db
      - key: SECRET_KEY
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

